aid: collegepulse
name: Collegepulse
description: 'College Pulse is an American market research and data analytics firm
  that specializes in survey-based insights from college students. Through an online
  student panel of 800,000+ verified undergraduates across 1,500+ campuses in all 50
  states, it has collected 130+ million survey responses and offers custom research,
  brand trackers, and syndicated reports to brands, media, and nonprofit organizations.
  Its work is used by outlets and institutions including The New York Times, the Knight
  Foundation, FiveThirtyEight, Forbes, Dell, GE, and Chegg. College Pulse is a research
  services company and does not currently publish a public developer API, SDKs, or
  developer documentation; this profile captures its public web surface and domain
  security posture.'
